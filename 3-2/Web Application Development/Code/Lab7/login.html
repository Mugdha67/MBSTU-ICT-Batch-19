<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="display" id="screen"></div>
        <div class="buttons">
            <button onclick="clearScreen()" class="btn">C</button>
            <button onclick="deleteLast()" class="btn">DEL</button>
            <button onclick="appendToScreen('/')" class="btn">/</button>
            <button onclick="appendToScreen('*')" class="btn">*</button>
            
            <button onclick="appendToScreen('7')" class="btn">7</button>
            <button onclick="appendToScreen('8')" class="btn">8</button>
            <button onclick="appendToScreen('9')" class="btn">9</button>
            <button onclick="appendToScreen('-')" class="btn">-</button>
            
            <button onclick="appendToScreen('4')" class="btn">4</button>
            <button onclick="appendToScreen('5')" class="btn">5</button>
            <button onclick="appendToScreen('6')" class="btn">6</button>
            <button onclick="appendToScreen('+')" class="btn">+</button>
            
            <button onclick="appendToScreen('1')" class="btn">1</button>
            <button onclick="appendToScreen('2')" class="btn">2</button>
            <button onclick="appendToScreen('3')" class="btn">3</button>
            <button onclick="calculate()" class="btn equal-btn">=</button>
            
            <button onclick="appendToScreen('0')" class="btn zero-btn">0</button>
            <button onclick="appendToScreen('.')" class="btn">.</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
