<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jop mala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <div class="card">
            <h2 class="title">Counter</h2>
            <h1 id="counter">0</h1>
            <div class="controls">
                <button id="increaseBtn" onclick="increase()">Increase</button>
                <button id="resetBtn" onclick="reset()">Reset</button>
                <button id="decreaseBtn" onclick="decrease()">Decrease</button>
                <button id="resetLabelBtn" onclick="resetLabel()">Reset Label</button>
                <button id="clapToggleBtn" class="clap-btn" onclick="toggleClap()">Enable Clap</button>
            </div>
            <div id="label-container" aria-live="polite">
                <span class="label-pill">Labels:</span>
                <span id="label" class="label-count">0</span>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
