<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Mantra Counting App | ॐ</title>  
<link rel="stylesheet" href="style.css">  
<script src="fun.js"></script>  
</head>  
<body>  
<div class="container">
  <div class="header">
    <h2 class="mantra-title">ॐ Mantra Counter ॐ</h2>
    <p class="subtitle">Sacred Counting </p>
  </div>
  
  <div class="counter-box">
    <div class="glow-ring"></div>
    <h1 id="counter" class="counter-display">0</h1>
    <p class="counter-label">Mantras Recited (0-108)</p>
  </div>
  
  <div class="spiritual-goal-box">
    <p class="goal-label">🏆 Spiritual Goals Completed</p>
    <h2 id="spiritual-goal" class="goal-display">0</h2>
  </div>
  
  <div class="button-container">
    <button class="btn btn-increase" onclick="increase()">✨ Add</button>   
    <button class="btn btn-reset" onclick="reset()">🙏 Reset</button>  
    <button class="btn btn-decrease" onclick="decrease()">↩️ Remove</button>  
  </div>
  
  <div class="footer">
    <p class="sacred-text">"ॐ" - The Universal Sound</p>
  </div>
</div>
</body>  
</html>
