<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Network Speed Test</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .speed-test {
        width: 380px;
        padding: 30px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        color: #fff;
        text-align: center;
    }

    h2 {
        margin-bottom: 25px;
        letter-spacing: 1px;
    }

    button {
        padding: 14px 28px;
        font-size: 16px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color: #fff;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .progress {
        margin-top: 20px;
        height: 8px;
        width: 100%;
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
        overflow: hidden;
        display: none;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00f260, #0575e6);
        animation: loading 2s infinite;
    }

    @keyframes loading {
        0% { width: 0%; }
        50% { width: 80%; }
        100% { width: 0%; }
    }

    .results {
        display: flex;
        justify-content: space-between;
        margin-top: 25px;
        gap: 12px;
    }

    .card {
        flex: 1;
        padding: 15px;
        border-radius: 14px;
        background: rgba(255,255,255,0.2);
        box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
    }

    .card span {
        font-size: 14px;
        opacity: 0.9;
    }

    .card h3 {
        margin: 8px 0 0;
        font-size: 20px;
    }
</style>
</head>

<body>

<div class="speed-test">
    <h2>🚀 Network Speed Test</h2>
    <button id="startBtn" onclick="startTest()">Start Test</button>

    <div class="progress" id="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="results">
        <div class="card">
            <span>Download</span>
            <h3 id="down">-- Mbps</h3>
        </div>
        <div class="card">
            <span>Upload</span>
            <h3 id="up">-- Mbps</h3>
        </div>
        <div class="card">
            <span>Ping</span>
            <h3 id="ping">-- ms</h3>
        </div>
    </div>
</div>

<script>
async function startTest() {
    const btn = document.getElementById("startBtn");
    const progress = document.getElementById("progress");

    btn.disabled = true;
    progress.style.display = "block";

    document.getElementById("down").innerText = "Testing...";
    document.getElementById("up").innerText = "Testing...";
    document.getElementById("ping").innerText = "Testing...";

    const download = await testDownloadSpeed();
    document.getElementById("down").innerText = download + " Mbps";

    const upload = await testUploadSpeed();
    document.getElementById("up").innerText = upload + " Mbps";

    const ping = await testPing();
    document.getElementById("ping").innerText = ping + " ms";

    progress.style.display = "none";
    btn.disabled = false;
}

// DOWNLOAD
async function testDownloadSpeed() {
    const url = "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg";
    const start = performance.now();
    const res = await fetch(url + "?v=" + Math.random());
    const blob = await res.blob();
    const end = performance.now();

    const bits = blob.size * 8;
    const time = (end - start) / 1000;
    return ((bits / time) / 1024 / 1024).toFixed(2);
}

// UPLOAD
async function testUploadSpeed() {
    const data = new Blob([new Uint8Array(4 * 1024 * 1024)]);
    const start = performance.now();

    await fetch("https://httpbin.org/post", {
        method: "POST",
        body: data
    });

    const end = performance.now();
    const bits = data.size * 8;
    const time = (end - start) / 1000;

    return ((bits / time) / 1024 / 1024).toFixed(2);
}

// PING
async function testPing() {
    const start = performance.now();
    await fetch("https://www.google.com/favicon.ico", { mode: "no-cors" });
    const end = performance.now();
    return Math.round(end - start);
}
</script>

</body>
</html>
